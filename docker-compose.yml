version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-smartcampus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: ${DB_NAME:-smartcampus_omnidesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcampus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcampus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartcampus_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampus-backend
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-smartcampus}
      - DB_PASSWORD=${DB_PASSWORD:-secure_password_change_me}
      - DB_NAME=${DB_NAME:-smartcampus_omnidesk}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - smartcampus_network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcampus-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - smartcampus_network
    command: npm run dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartcampus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcampus.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smartcampus_network

volumes:
  postgres_data:
  redis_data:

networks:
  smartcampus_network:
    driver: bridge
